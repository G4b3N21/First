<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zenei Jegyzet">
  <link rel="apple-touch-icon" href="ikon.png">
  <title>Zenei Jegyzet</title>
  <style>
    body {
      background-color: #121212;
      color: #f0e6d2;
      font-family: -apple-system, sans-serif;
      margin: 0;
      padding: 40px 20px 20px 20px;
    }
    h1 { color: #d4af37; font-size: 24px; text-align: center; }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      background: #1e1e1e;
      border: 1px solid #333;
      color: #fff;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      background-color: #d4af37;
      color: #121212;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .kartya {
      background: #1e1e1e;
      border-left: 4px solid #d4af37;
      padding: 12px;
      margin-top: 15px;
      border-radius: 6px;
    }
    .kartya h3 { margin: 0 0 5px 0; color: #d4af37; font-size: 18px; }
    .kartya p { margin: 0; font-size: 15px; line-height: 1.4; }
    .torles {
      background: none;
      color: #888;
      width: auto;
      padding: 5px 0 0 0;
      font-size: 12px;
      font-weight: normal;
    }
  </style>
</head>
<body>

  <h1>🎷 Kreatív Jegyzet</h1>
  
  <input type="text" id="cim" placeholder="Téma vagy hangszer (pl. Duduk + Trip-hop)">
  <textarea id="szoveg" rows="3" placeholder="Ötlet, dalszöveg vagy hangulat..."></textarea>
  <button onclick="mentes()">Mentés az appba</button>

  <div id="lista"></div>

  <script>
    // IDE ILLESZTHETED A SAJÁT SVG KÓDODAT A KÉT VISSZAPERJEL ('') KÖZÉ:
    const sajatSvg = `<svg xmlns="http://w3.org" viewBox="0 0 512 512">
      <rect width="512" height="512" fill="#121212"/>
      <circle cx="256" cy="256" r="190" fill="none" stroke="#d4af37" stroke-width="24"/>
      <path d="M290 140 v180 a45 45 0 1 1 -30 -42 v-138 l90 -25 v45 z" fill="#d4af37"/>
    </svg>`;

    // Ez a rész automatikusan PNG ikont gyárt az SVG-ből az iPhone számára:
    (function ikontGeneral() {
      const img = new Image();
      const svgBlob = new Blob([sajatSvg], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 512, 512);
        document.getElementById('app-ikon').href = canvas.toDataURL('image/png');
        URL.revokeObjectURL(url);
      };
      img.src = url;
    })();

    let jegyzetek = JSON.parse(localStorage.getItem('sajatJegyzetek')) || [];

    function megjelenit() {
      const lista = document.getElementById('lista');
      lista.innerHTML = '';
      jegyzetek.forEach((elem, index) => {
        lista.innerHTML += `
          <div class="kartya">
            <h3>${elem.cim}</h3>
            <p>${elem.szoveg}</p>
            <button class="torles" onclick="torles(${index})">Törlés</button>
          </div>
        `;
      });
    }

    function mentes() {
      const cim = document.getElementById('cim').value;
      const szoveg = document.getElementById('szoveg').value;
      if (!cim && !szoveg) return;
      
      jegyzetek.unshift({ cim: cim || 'Névtelen ötlet', szoveg: szoveg });
      localStorage.setItem('sajatJegyzetek', JSON.stringify(jegyzetek));
      
      document.getElementById('cim').value = '';
      document.getElementById('szoveg').value = '';
      megjelenit();
    }

    function torles(index) {
      jegyzetek.splice(index, 1);
      localStorage.setItem('sajatJegyzetek', JSON.stringify(jegyzetek));
      megjelenit();
    }

    megjelenit();
  </script>

</body>
</html>
