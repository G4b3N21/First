<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
  <title>Gaben War</title>
  <link rel="icon" type="image/jpeg" href="ikon.jpg" />
  <link rel="apple-touch-icon" href="ikon.jpg" />
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --border:#334155; --input:#0f172a; --text:#f8fafc; --muted:#94a3b8; --primary:#3b82f6; --win:#10b981; --loss:#ef4444; --gold:#f59e0b; --purple:#a855f7; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { background:var(--bg); color:var(--text); padding-top:env(safe-area-inset-top, 16px); padding-bottom:95px; }
    .container { max-width:600px; margin:0 auto; padding:16px 14px; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .app-title { display:flex; align-items:center; gap:10px; }
    .app-title img { width:38px; height:38px; border-radius:10px; object-fit:cover; border:1px solid var(--border); }
    .title-text h1 { font-size:1.15rem; font-weight:800; line-height:1.1; }
    .guild-subtitle { font-size:0.75rem; color:var(--gold); font-weight:700; letter-spacing:0.4px; margin-top:2px; }
    .backup-btns { display:flex; gap:5px; }
    .btn-small { background:var(--card); color:var(--muted); border:1px solid var(--border); padding:6px 9px; border-radius:8px; font-size:0.72rem; font-weight:600; cursor:pointer; }
    .backup-banner { display:none; justify-content:space-between; align-items:center; background:rgba(245,158,11,0.15); border:1px solid rgba(245,158,11,0.45); color:#fde68a; padding:9px 12px; border-radius:10px; margin-bottom:12px; font-size:0.8rem; font-weight:600; cursor:pointer; }
    .stats-bar { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px; margin-bottom:12px; text-align:center; }
    .stat-box span { display:block; font-size:0.68rem; color:var(--muted); text-transform:uppercase; }
    .stat-box strong { font-size:1.08rem; font-weight:700; }
    .stat-win { color:var(--win); }
    .search-box { position:relative; margin-bottom:10px; }
    .search-box input { width:100%; background:var(--card); border:1px solid var(--border); color:var(--text); padding:11px 36px 11px 14px; border-radius:10px; font-size:0.95rem; outline:none; }
    .clear-search { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); font-size:1.1rem; cursor:pointer; display:none; }
    .filters { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:12px; }
    .filter-btn { background:var(--card); border:1px solid var(--border); color:var(--muted); padding:6px 12px; border-radius:20px; font-size:0.8rem; font-weight:600; white-space:nowrap; cursor:pointer; }
    .filter-btn.active { background:var(--primary); border-color:var(--primary); color:#fff; }
    .filter-btn.train-filter.active { background:var(--purple); border-color:var(--purple); color:#fff; }
    .battle-list { display:flex; flex-direction:column; gap:12px; }
    .battle-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 14px; }
    .card-header { display:flex; justify-content:space-between; align-items:center; padding-bottom:8px; border-bottom:1px solid var(--border); margin-bottom:10px; font-size:0.8rem; }
    .meta-info { color:var(--muted); display:flex; flex-wrap:wrap; align-items:center; gap:5px; }
    .guild-tag { color:var(--gold); font-weight:600; }
    .train-pill { background:rgba(168,85,247,0.18); color:#d8b4fe; border:1px solid rgba(168,85,247,0.4); padding:1px 7px; border-radius:5px; font-size:0.7rem; font-weight:700; text-transform:uppercase; }
    .badge { padding:3px 9px; border-radius:6px; font-weight:800; font-size:0.75rem; }
    .badge.win { background:rgba(16,185,129,0.15); color:var(--win); border:1px solid rgba(16,185,129,0.3); }
    .badge.loss { background:rgba(239,68,68,0.15); color:var(--loss); border:1px solid rgba(239,68,68,0.3); }
    .teams-grid { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:start; }
    .team-col.enemy { text-align:right; }
    .player-name { font-weight:700; font-size:0.95rem; margin-bottom:2px; }
    .team-power { font-size:0.85rem; font-weight:700; color:var(--primary); margin-bottom:6px; }
    .team-col.enemy .team-power { color:#f472b6; }
    .hero-list { list-style:none; font-size:0.82rem; color:#cbd5e1; line-height:1.45; }
    .vs-divider { align-self:center; font-size:0.75rem; font-weight:800; color:var(--muted); background:var(--input); padding:4px 6px; border-radius:6px; }
    .card-footer { display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:8px; border-top:1px solid var(--border); font-size:0.78rem; }
    .power-diff { color:var(--muted); font-weight:600; }
    .diff-pos { color:var(--win); }
    .diff-neg { color:#fb923c; }
    .card-actions { display:flex; gap:8px; }
    .action-btn { background:none; border:1px solid var(--border); color:var(--muted); padding:4px 10px; border-radius:6px; font-size:0.75rem; cursor:pointer; }
    .action-btn.delete { color:var(--loss); border-color:rgba(239,68,68,0.3); }
    .empty-state { text-align:center; padding:40px 20px; color:var(--muted); font-size:0.95rem; }
    .fab { position:fixed; bottom:20px; right:20px; left:20px; max-width:560px; margin:0 auto; background:var(--primary); color:#fff; border:none; padding:14px; border-radius:14px; font-size:1rem; font-weight:700; box-shadow:0 10px 15px -3px rgba(37,99,235,0.4); cursor:pointer; z-index:10; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.82); display:none; justify-content:center; align-items:flex-start; overflow-y:auto; padding:calc(env(safe-area-inset-top, 12px) + 8px) 12px 12px; z-index:50; }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--card); border:1px solid var(--border); border-radius:16px; width:100%; max-width:560px; padding:16px; margin-bottom:30px; }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .close-modal { background:none; border:none; color:var(--muted); font-size:1.5rem; cursor:pointer; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
    .form-group { margin-bottom:12px; }
    label { display:block; font-size:0.78rem; color:var(--muted); margin-bottom:4px; font-weight:600; }
    input[type="text"], input[type="number"], input[type="date"], select { width:100%; background:var(--input); border:1px solid var(--border); color:var(--text); padding:10px; border-radius:8px; font-size:0.9rem; outline:none; }
    .preset-bar { display:flex; gap:6px; margin-bottom:10px; }
    .preset-bar select { padding:7px 8px; font-size:0.82rem; flex:1; }
    .preset-save { background:rgba(59,130,246,0.2); color:#93c5fd; border:1px solid rgba(59,130,246,0.4); padding:0 10px; border-radius:8px; font-size:0.78rem; font-weight:700; cursor:pointer; white-space:nowrap; }
    .preset-del { background:rgba(239,68,68,0.15); color:var(--loss); border:1px solid rgba(239,68,68,0.3); padding:0 9px; border-radius:8px; font-size:0.82rem; font-weight:700; cursor:pointer; }
    .toggle-group { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .toggle-group.three { grid-template-columns:1fr 1fr 1fr; }
    .toggle-btn { background:var(--input); border:1px solid var(--border); color:var(--muted); padding:10px 6px; border-radius:8px; font-weight:700; font-size:0.82rem; cursor:pointer; }
    .toggle-btn.active { background:var(--primary); border-color:var(--primary); color:#fff; }
    .toggle-btn.train-btn.active { background:var(--purple); border-color:var(--purple); color:#fff; }
    .toggle-btn.win-btn.active { background:var(--win); border-color:var(--win); color:#052e16; }
    .toggle-btn.loss-btn.active { background:var(--loss); border-color:var(--loss); color:#fff; }
    .team-section { background:rgba(15,23,42,0.5); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:12px; }
    .team-section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .team-section-header h3 { font-size:0.92rem; color:var(--primary); }
    .team-section.enemy h3 { color:#f472b6; }
    .heroes-inputs { display:grid; grid-template-columns:1fr; gap:6px; }
    .save-btn { width:100%; background:var(--win); color:#052e16; border:none; padding:13px; border-radius:10px; font-size:1rem; font-weight:800; cursor:pointer; margin-top:6px; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="app-title">
      <img src="ikon.jpg" alt="Icon" onerror="this.style.display='none'" />
      <div class="title-text">
        <h1>Gaben War</h1>
        <div class="guild-subtitle">⚔️ Chilligan's Tavern</div>
      </div>
    </div>
    <div class="backup-btns">
      <button class="btn-small" onclick="exportCSV()">CSV</button>
      <button class="btn-small" onclick="exportJSON()">Export</button>
      <button class="btn-small" onclick="document.getElementById('importFile').click()">Import</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)" />
    </div>
  </header>

  <div class="backup-banner" id="backupBanner" onclick="exportJSON()">
    <span>💾 Unsaved changes! Tap to save backup file</span>
    <span>Export ›</span>
  </div>

  <div class="stats-bar">
    <div class="stat-box"><span id="statLabel">War Battles</span><strong id="statTotal">0</strong></div>
    <div class="stat-box"><span>Wins / Losses</span><strong id="statWL">0 / 0</strong></div>
    <div class="stat-box"><span>Win Rate</span><strong id="statRate" class="stat-win">0%</strong></div>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search hero, player or guild..." oninput="handleSearch()" />
    <button class="clear-search" id="clearSearchBtn" onclick="clearSearch()">✕</button>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('Local War', this)">Local War</button>
    <button class="filter-btn" onclick="setFilter('Global War', this)">Global War</button>
    <button class="filter-btn train-filter" onclick="setFilter('Training', this)">Training</button>
    <button class="filter-btn" onclick="setFilter('win', this)">Wins</button>
    <button class="filter-btn" onclick="setFilter('loss', this)">Losses</button>
  </div>
  <div id="battleList" class="battle-list"></div>
</div>
<button class="fab" onclick="openModal()">+ New Battle</button>
<div class="modal-overlay" id="battleModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">New Battle</h2>
      <button class="close-modal" onclick="closeModal()">✕</button>
    </div>
    <form id="battleForm" onsubmit="saveBattle(event)">
      <input type="hidden" id="editId" />
      <div class="form-row">
        <div><label>Date</label><input type="date" id="battleDate" required /></div>
        <div><label>Enemy Guild (optional)</label><input type="text" id="guildName" list="guildList" placeholder="e.g. Vortex" /></div>
      </div>
      <div class="form-group">
        <label>War Type</label>
        <div class="toggle-group three">
          <button type="button" class="toggle-btn active" id="typeLocal" onclick="selectType('Local War')">Local War</button>
          <button type="button" class="toggle-btn" id="typeGlobal" onclick="selectType('Global War')">Global War</button>
          <button type="button" class="toggle-btn train-btn" id="typeTrain" onclick="selectType('Training')">Training</button>
        </div>
      </div>
      <div class="team-section">
        <div class="team-section-header">
          <h3>My Team (Attack)</h3>
          <button type="button" class="btn-small" onclick="loadLastMyTeam()">Load Last</button>
        </div>
        <div class="preset-bar">
          <select id="presetSelect" onchange="applyPreset()">
            <option value="">-- Load Saved Team --</option>
          </select>
          <button type="button" class="preset-save" onclick="savePreset()">+ Save</button>
          <button type="button" class="preset-del" onclick="deletePreset()" title="Delete selected preset">✕</button>
        </div>
        <div class="form-row">
          <div><label>My Name</label><input type="text" id="myName" placeholder="Gaben" required /></div>
          <div><label>Power (k)</label><input type="number" id="myPower" placeholder="879" required /></div>
        </div>
        <label>Heroes (5)</label>
        <div class="heroes-inputs">
          <input type="text" class="my-hero" list="heroList" placeholder="Hero 1" />
          <input type="text" class="my-hero" list="heroList" placeholder="Hero 2" />
          <input type="text" class="my-hero" list="heroList" placeholder="Hero 3" />
          <input type="text" class="my-hero" list="heroList" placeholder="Hero 4" />
          <input type="text" class="my-hero" list="heroList" placeholder="Hero 5" />
        </div>
      </div>
      <div class="team-section enemy">
        <div class="team-section-header"><h3>Enemy Team</h3></div>
        <div class="form-row">
          <div><label>Enemy Name</label><input type="text" id="enemyName" placeholder="XaYb" required /></div>
          <div><label>Power (k)</label><input type="number" id="enemyPower" placeholder="941" required /></div>
        </div>
        <label>Enemy Heroes (5)</label>
        <div class="heroes-inputs">
          <input type="text" class="enemy-hero" list="heroList" placeholder="Hero 1" />
          <input type="text" class="enemy-hero" list="heroList" placeholder="Hero 2" />
          <input type="text" class="enemy-hero" list="heroList" placeholder="Hero 3" />
          <input type="text" class="enemy-hero" list="heroList" placeholder="Hero 4" />
          <input type="text" class="enemy-hero" list="heroList" placeholder="Hero 5" />
        </div>
      </div>
      <div class="form-group">
        <label>Result</label>
        <div class="toggle-group">
          <button type="button" class="toggle-btn win-btn active" id="resWin" onclick="selectResult('win')">WIN</button>
          <button type="button" class="toggle-btn loss-btn" id="resLoss" onclick="selectResult('loss')">LOSS</button>
        </div>
      </div>
      <button type="submit" class="save-btn">Save Battle</button>
    </form>
  </div>
</div>
<datalist id="heroList"></datalist>
<datalist id="guildList"></datalist>
<script>
  const STORAGE_KEY = 'war_battle_log_v1';
  const PROFILE_KEY = 'war_battle_profile_v1';
  const PRESETS_KEY = 'war_battle_presets_v1';
  const DIRTY_KEY = 'war_battle_dirty_count';
  const DB_NAME = 'GabenWarVaultDB';
  const STORE_NAME = 'kv_store';

  let battles = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let presets = JSON.parse(localStorage.getItem(PRESETS_KEY) || '[]');
  let dirtyCount = Number(localStorage.getItem(DIRTY_KEY) || '0');
  let currentFilter = 'all';
  let selectedType = 'Local War';
  let selectedResult = 'win';

  // Request Persistent Storage on iOS/Chrome
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }

  // Dual Storage (IndexedDB + localStorage self-healing)
  function openVaultDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME);
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = e => reject(e.target.error);
    });
  }
  async function vaultSet(key, val) {
    try {
      const db = await openVaultDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(val, key);
    } catch (e) {}
  }
  async function vaultGet(key) {
    try {
      const db = await openVaultDB();
      return await new Promise(res => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const r = tx.objectStore(STORE_NAME).get(key);
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      });
    } catch (e) { return null; }
  }
  async function syncFromVault() {
    const vBattles = await vaultGet(STORAGE_KEY);
    const vPresets = await vaultGet(PRESETS_KEY);
    let restored = false;
    if ((!battles || battles.length === 0) && Array.isArray(vBattles) && vBattles.length > 0) {
      battles = vBattles;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(battles));
      restored = true;
    } else if (battles.length > 0) {
      vaultSet(STORAGE_KEY, battles);
    }
    if ((!presets || presets.length === 0) && Array.isArray(vPresets) && vPresets.length > 0) {
      presets = vPresets;
      localStorage.setItem(PRESETS_KEY, JSON.stringify(presets));
      restored = true;
    } else if (presets.length > 0) {
      vaultSet(PRESETS_KEY, presets);
    }
    if (restored) {
      updateDatalists();
      renderPresetsDropdown();
      renderBattles();
    }
  }

  function updateBackupBanner() {
    const banner = document.getElementById('backupBanner');
    if (banner) banner.style.display = dirtyCount >= 5 ? 'flex' : 'none';
  }
  function markDirty() {
    dirtyCount++;
    localStorage.setItem(DIRTY_KEY, String(dirtyCount));
    updateBackupBanner();
  }
  function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(battles));
    vaultSet(STORAGE_KEY, battles);
    updateDatalists();
    renderBattles();
  }
  function savePresetsStorage() {
    localStorage.setItem(PRESETS_KEY, JSON.stringify(presets));
    vaultSet(PRESETS_KEY, presets);
    renderPresetsDropdown();
  }
  function renderPresetsDropdown(selectedIdx = '') {
    const sel = document.getElementById('presetSelect');
    sel.innerHTML = `<option value="">-- Load Saved Team (${presets.length}) --</option>` +
      presets.map((p, i) => `<option value="${i}">${escapeHtml(p.name)} (${escapeHtml(p.power)}k)</option>`).join('');
    sel.value = selectedIdx;
  }
  function savePreset() {
    const heroes = Array.from(document.querySelectorAll('.my-hero')).map(i => i.value.trim());
    const power = document.getElementById('myPower').value.trim();
    const myName = document.getElementById('myName').value.trim();
    if (!heroes.some(Boolean)) { alert('Enter at least one hero first.'); return; }
    const defaultName = heroes.filter(Boolean).slice(0, 2).join('-');
    const name = prompt('Team preset name (e.g. Main Team):', defaultName);
    if (!name || !name.trim()) return;
    const cleanName = name.trim();
    const existingIdx = presets.findIndex(p => p.name.toLowerCase() === cleanName.toLowerCase());
    const obj = { name: cleanName, myName, power, heroes };
    if (existingIdx !== -1) {
      presets.splice(existingIdx, 1, obj);
      savePresetsStorage();
      renderPresetsDropdown(String(existingIdx));
    } else {
      presets.push(obj);
      savePresetsStorage();
      renderPresetsDropdown(String(presets.length - 1));
    }
    markDirty();
  }
  function applyPreset() {
    const idx = document.getElementById('presetSelect').value;
    if (idx === '') return;
    const p = presets.at(Number(idx));
    if (!p) return;
    if (p.myName) document.getElementById('myName').value = p.myName;
    if (p.power) document.getElementById('myPower').value = p.power;
    document.querySelectorAll('.my-hero').forEach((inp, i) => inp.value = (p.heroes && p.heroes.at(i)) || '');
  }
  function deletePreset() {
    const idx = document.getElementById('presetSelect').value;
    if (idx === '') { alert('Select a saved team from the dropdown first.'); return; }
    const p = presets.at(Number(idx));
    if (p && confirm(`Delete preset "${p.name}"?`)) {
      presets.splice(Number(idx), 1);
      savePresetsStorage();
    }
  }
    function formatDisplayDate(d) {
    if (!d) return '';
    const p = d.split('-');
    return p.length === 3 ? p.at(1) + '/' + p.at(2) + '/' + p.at(0) : d;
  }

  function getTodayISO() {
    const now = new Date();
    return new Date(now - now.getTimezoneOffset() * 60000).toISOString().split('T').at(0);
  }
  function escapeHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function updateDatalists() {
    const heroes = new Set(), guilds = new Set();
    battles.forEach(b => {
      if (b.guild) guilds.add(b.guild.trim());
      (b.myHeroes || []).forEach(h => { if (h) heroes.add(h.trim()); });
      (b.enemyHeroes || []).forEach(h => { if (h) heroes.add(h.trim()); });
    });
    presets.forEach(p => (p.heroes || []).forEach(h => { if (h) heroes.add(h.trim()); }));
    document.getElementById('heroList').innerHTML = Array.from(heroes).sort().map(h => `<option value="${escapeHtml(h)}">`).join('');
    document.getElementById('guildList').innerHTML = Array.from(guilds).sort().map(g => `<option value="${escapeHtml(g)}">`).join('');
  }
  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderBattles();
  }
  function handleSearch() {
    const v = document.getElementById('searchInput').value;
    document.getElementById('clearSearchBtn').style.display = v ? 'block' : 'none';
    renderBattles();
  }
  function clearSearch() {
    document.getElementById('searchInput').value = '';
    document.getElementById('clearSearchBtn').style.display = 'none';
    renderBattles();
  }
  function renderBattles() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const listEl = document.getElementById('battleList');
    const filtered = battles.filter(b => {
      if (currentFilter === 'Training') {
        if (b.type !== 'Training') return false;
      } else {
        if (b.type === 'Training' && !q) return false;
        if (currentFilter === 'Local War' && b.type !== 'Local War') return false;
        if (currentFilter === 'Global War' && b.type !== 'Global War') return false;
        if (currentFilter === 'win' && b.result !== 'win') return false;
        if (currentFilter === 'loss' && b.result !== 'loss') return false;
      }
      if (q) {
        const hay = [b.guild, b.myName, b.enemyName, ...(b.myHeroes||[]), ...(b.enemyHeroes||[])].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const statList = currentFilter === 'Training' ? filtered : filtered.filter(b => b.type !== 'Training');
    const total = statList.length;
    const wins = statList.filter(b => b.result === 'win').length;
    document.getElementById('statLabel').textContent = currentFilter === 'Training' ? 'Training' : 'War Battles';
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statWL').textContent = `${wins} / ${total - wins}`;
    document.getElementById('statRate').textContent = `${total > 0 ? Math.round((wins / total) * 100) : 0}%`;
    if (filtered.length === 0) {
      listEl.innerHTML = `<div class="empty-state">No battles found.<br>Tap <strong>+ New Battle</strong> to log your first match!</div>`;
      return;
    }
    listEl.innerHTML = filtered.map(b => {
      const diff = Number(b.myPower) - Number(b.enemyPower);
      const diffText = diff > 0 ? `+${diff}k` : `${diff}k`;
      const myH = (b.myHeroes||[]).filter(Boolean).map(h => `<li>${escapeHtml(h)}</li>`).join('');
      const enH = (b.enemyHeroes||[]).filter(Boolean).map(h => `<li>${escapeHtml(h)}</li>`).join('');
      const gTag = b.guild ? `<span>•</span><span class="guild-tag">vs. ${escapeHtml(b.guild)}</span>` : '';
      const typeTag = b.type === 'Training' ? `<span class="train-pill">Training</span>` : `<span>${escapeHtml(b.type)}</span>`;
      return `<div class="battle-card">
        <div class="card-header">
          <div class="meta-info"><span>${formatDisplayDate(b.date)}</span><span>•</span>${typeTag}${gTag}</div>
          <span class="badge ${b.result}">${b.result.toUpperCase()}</span>
        </div>
        <div class="teams-grid">
          <div class="team-col"><div class="player-name">${escapeHtml(b.myName)}</div><div class="team-power">${escapeHtml(b.myPower)}k</div><ul class="hero-list">${myH}</ul></div>
          <div class="vs-divider">VS</div>
          <div class="team-col enemy"><div class="player-name">${escapeHtml(b.enemyName)}</div><div class="team-power">${escapeHtml(b.enemyPower)}k</div><ul class="hero-list">${enH}</ul></div>
        </div>
        <div class="card-footer">
          <div class="power-diff">Power diff: <span class="${diff >= 0 ? 'diff-pos' : 'diff-neg'}">${diffText}</span></div>
          <div class="card-actions">
            <button class="action-btn" onclick="editBattle('${b.id}')">Edit</button>
            <button class="action-btn delete" onclick="deleteBattle('${b.id}')">Delete</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }
  function selectType(t) {
    selectedType = t;
    document.getElementById('typeLocal').classList.toggle('active', t === 'Local War');
    document.getElementById('typeGlobal').classList.toggle('active', t === 'Global War');
    document.getElementById('typeTrain').classList.toggle('active', t === 'Training');
  }
  function selectResult(r) {
    selectedResult = r;
    document.getElementById('resWin').classList.toggle('active', r === 'win');
    document.getElementById('resLoss').classList.toggle('active', r === 'loss');
  }
  function openModal(b = null) {
    document.getElementById('battleForm').reset();
    renderPresetsDropdown();
    if (b) {
      document.getElementById('modalTitle').textContent = 'Edit Battle';
      document.getElementById('editId').value = b.id;
      document.getElementById('battleDate').value = b.date;
      document.getElementById('guildName').value = b.guild || '';
      selectType(b.type || 'Local War');
      selectResult(b.result || 'win');
      document.getElementById('myName').value = b.myName || '';
      document.getElementById('myPower').value = b.myPower || '';
      document.querySelectorAll('.my-hero').forEach((inp, i) => inp.value = (b.myHeroes && b.myHeroes.at(i)) || '');
      document.getElementById('enemyName').value = b.enemyName || '';
      document.getElementById('enemyPower').value = b.enemyPower || '';
      document.querySelectorAll('.enemy-hero').forEach((inp, i) => inp.value = (b.enemyHeroes && b.enemyHeroes.at(i)) || '');
    } else {
      document.getElementById('modalTitle').textContent = 'New Battle';
      document.getElementById('editId').value = '';
      document.getElementById('battleDate').value = getTodayISO();
      selectType('Local War');
      selectResult('win');
      const prof = JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}');
      if (prof.myName) document.getElementById('myName').value = prof.myName;
    }
    document.getElementById('battleModal').classList.add('open');
  }
  function closeModal() { document.getElementById('battleModal').classList.remove('open'); }
  function loadLastMyTeam() {
    if (!battles.length) { alert('No previous battles saved yet.'); return; }
    const last = battles.at(0);
    document.getElementById('myName').value = last.myName || '';
    document.getElementById('myPower').value = last.myPower || '';
    document.querySelectorAll('.my-hero').forEach((inp, i) => inp.value = (last.myHeroes && last.myHeroes.at(i)) || '');
  }
  function saveBattle(e) {
    e.preventDefault();
    const editId = document.getElementById('editId').value;
    const myName = document.getElementById('myName').value.trim();
    const rec = {
      id: editId || Date.now().toString(),
      date: document.getElementById('battleDate').value,
      type: selectedType,
      guild: document.getElementById('guildName').value.trim(),
      myName,
      myPower: document.getElementById('myPower').value.trim(),
      myHeroes: Array.from(document.querySelectorAll('.my-hero')).map(i => i.value.trim()),
      enemyName: document.getElementById('enemyName').value.trim(),
      enemyPower: document.getElementById('enemyPower').value.trim(),
      enemyHeroes: Array.from(document.querySelectorAll('.enemy-hero')).map(i => i.value.trim()),
      result: selectedResult
    };
    localStorage.setItem(PROFILE_KEY, JSON.stringify({ myName }));
    if (editId) {
      const idx = battles.findIndex(x => x.id === editId);
      if (idx !== -1) battles.splice(idx, 1, rec);
    } else {
      battles.unshift(rec);
    }
    battles.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    saveToStorage();
    markDirty();
    closeModal();
  }
  function editBattle(id) { const b = battles.find(x => x.id === id); if (b) openModal(b); }
  function deleteBattle(id) { if (confirm('Delete this battle log?')) { battles = battles.filter(x => x.id !== id); saveToStorage(); } }
  function exportJSON() {
    const payload = { battles, presets };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `gaben-war-backup-${getTodayISO()}.json`; a.click();
    dirtyCount = 0;
    localStorage.setItem(DIRTY_KEY, '0');
    updateBackupBanner();
  }
  function importJSON(e) {
    const f = e.target.files.item(0); if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const imp = JSON.parse(ev.target.result);
        if (Array.isArray(imp)) {
          if (confirm(`Import ${imp.length} battles? This replaces current list.`)) { battles = imp; saveToStorage(); }
        } else if (imp && Array.isArray(imp.battles)) {
          if (confirm(`Import ${imp.battles.length} battles and ${(imp.presets||[]).length} presets?`)) {
            battles = imp.battles;
            if (Array.isArray(imp.presets)) { presets = imp.presets; savePresetsStorage(); }
            saveToStorage();
          }
        }
      } catch { alert('Invalid backup file.'); }
      e.target.value = '';
    };
    r.readAsText(f);
  }
  function exportCSV() {
    if (!battles.length) { alert('No battles to export.'); return; }
    const h = ['Date','Type','Guild','My Name','My Team','My Power','Enemy Name','Enemy Team','Enemy Power','Result'];
    const rows = battles.map(b => [formatDisplayDate(b.date), b.type, b.guild||'', b.myName, (b.myHeroes||[]).filter(Boolean).join(', '), `${b.myPower}k`, b.enemyName, (b.enemyHeroes||[]).filter(Boolean).join(', '), `${b.enemyPower}k`, b.result.toUpperCase()]);
    const csv = [h, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `gaben-war-${getTodayISO()}.csv`; a.click();
  }
  updateDatalists(); renderPresetsDropdown(); renderBattles(); updateBackupBanner(); syncFromVault();
</script>
</body>
</html>
